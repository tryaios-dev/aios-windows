# CI for the Windows desktop app (B-02, B-05).
#   lint + unit tests on Linux AND Windows   (B-02 step one; M-23: never Windows-only Python)
#   llama-server built from pinned source + patch, engine tests (D-03)
#   backend.exe + installer on Windows       (B-02 step two)
#   dependency scan                          (B-05)
# A red run blocks the merge once `main` has a ruleset requiring these checks
# (docs/github-setup.md). Signing happens only in release.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"        # weekly dependency scan against new advisories
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Small model used only to prove the engine starts, authenticates and answers (D-03).
  # Its attention heads (64) must be a multiple of 32: the engine runs with a q8_0 KV cache
  # (launcher.SIZE_FLAGS), which llama.cpp refuses for smaller heads (stories260K has 8).
  # SmolLM2-135M-Instruct, Apache-2.0, pinned revision, ~100 MB.
  TEST_MODEL_URL: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q4_K_M.gguf
  TEST_MODEL_SHA256: 2e8040ceae7815abe0dcb3540b9995eaa1fa0d2ca9e797d0a635ae4433c68c2d

jobs:
  py-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check                       # pyproject changed without relocking -> fail
      - run: uv sync --frozen --all-packages --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/py/aios-common/src services/backend/aios_backend services/backend/db services/evidence-writer/aios_evidence_writer
      - run: uv run lint-imports
      - run: uv run aios-backend --profile test migrate   # SQLCipher opens, migrations apply
      - run: uv run aios-backend --profile test check     # at head, models match migrations
      - run: uv run aios-backend openapi --check
      - run: uv run python tools/contracts/gen_process_ipc_vectors.py --check   # golden vectors current (D-02)
      - run: uv run python tools/contracts/gen_evidence_vectors.py --check      # evidence golden vectors current (F-02)
      - run: uv run python tools/contracts/gen_project_packages.py --check      # golden project packages current (J-02)
      - run: uv run python tools/contracts/gen_recovery_reference.py --check    # reference Recovery Package current (E-03)

  py-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-packages --all-extras
      - run: uv run python tools/run_tests.py

  ts-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4                 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile        # unlocked dependency -> fail
      - run: pnpm typecheck
      - run: pnpm lint

  ts-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @aios/desktop test:security

  llama-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: uv sync --frozen --all-packages --all-extras
      - run: uv run python build/llama/build.py cpu
      - name: Fetch test model
        run: |
          curl -sfL -o "$RUNNER_TEMP/test.gguf" "$TEST_MODEL_URL"
          echo "$TEST_MODEL_SHA256  $RUNNER_TEMP/test.gguf" | sha256sum -c -
      - name: Engine tests (D-03)
        env:
          AIOS_LLAMA_SERVER: ${{ github.workspace }}/build/out/llama/cpu/llama-server
          AIOS_TEST_MODEL: ${{ runner.temp }}/test.gguf
        run: uv run pytest -v tests/engine
      - name: Backend -> engine end to end (D-04 spike, D-05 process manager)
        env:
          AIOS_LLAMA_SERVER: ${{ github.workspace }}/build/out/llama/cpu/llama-server
          AIOS_TEST_MODEL: ${{ runner.temp }}/test.gguf
        working-directory: services/backend
        run: uv run pytest -v tests/test_spike.py tests/test_engine_launcher.py tests/test_engine_lifetime.py

  llama-windows:
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, vulkan]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - run: choco install ninja --no-progress
      - name: Vulkan SDK (version pinned in build/llama/manifest.json)
        if: matrix.variant == 'vulkan'
        run: |
          $v = (Get-Content build/llama/manifest.json | ConvertFrom-Json).vulkan_sdk
          curl.exe -sfL -o "$env:RUNNER_TEMP\vulkan.exe" "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe"
          & "$env:RUNNER_TEMP\vulkan.exe" --accept-licenses --default-answer --confirm-command install | Out-Null
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$v"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$v\bin"
      - run: uv sync --frozen --all-packages --all-extras
      - run: uv run python build/llama/build.py ${{ matrix.variant }}
      - name: Fetch test model
        run: |
          curl.exe -sfL -o "$env:RUNNER_TEMP\test.gguf" $env:TEST_MODEL_URL
          $hash = (Get-FileHash "$env:RUNNER_TEMP\test.gguf" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:TEST_MODEL_SHA256) { throw "test model digest mismatch: $hash" }
      # The runner has no GPU: the vulkan variant falls back to its CPU backend here.
      - name: Engine tests (D-03)
        env:
          AIOS_LLAMA_SERVER: ${{ github.workspace }}\build\out\llama\${{ matrix.variant }}\llama-server.exe
          AIOS_TEST_MODEL: ${{ runner.temp }}\test.gguf
        run: uv run pytest -v tests/engine
      - name: Backend -> engine end to end (D-04 spike, D-05 process manager), incl. Job Object and AC-09
        if: matrix.variant == 'cpu'
        env:
          AIOS_LLAMA_SERVER: ${{ github.workspace }}\build\out\llama\cpu\llama-server.exe
          AIOS_TEST_MODEL: ${{ runner.temp }}\test.gguf
        working-directory: services/backend
        run: uv run pytest -v tests/test_spike.py tests/test_engine_launcher.py tests/test_engine_lifetime.py
      - uses: actions/upload-artifact@v4
        with:
          name: llama-${{ matrix.variant }}
          path: |
            build/out/llama/${{ matrix.variant }}/
            build/out/llama/manifest-${{ matrix.variant }}.json
          retention-days: 14

  e2e:                                           # UI -> preload -> main handlers -> real backend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: uv sync --frozen --all-packages --all-extras
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  backend-linux-build:                           # B-03 / AC-23: backend + writer build on Ubuntu (not shipped)
    needs: [py-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-packages --all-extras
      - run: uv run pyinstaller build/pyinstaller/backend.spec --distpath build/out --workpath build/out/work --noconfirm
      - run: uv run pyinstaller build/pyinstaller/evidence-writer.spec --distpath build/out --workpath build/out/work-writer --noconfirm
      - run: uv run python tools/smoke_linux_build.py

  package-windows:
    needs: [py-lint, py-unit, ts-lint, ts-unit, e2e, llama-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: uv sync --frozen --all-packages --all-extras
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4         # patched llama-server builds from llama-windows
        with:
          pattern: llama-*
          path: build/out/llama
          merge-multiple: true
      - run: pnpm build:backend                    # backend.exe (PyInstaller)
      - run: uv run python tools/smoke_backend_exe.py   # D-01 / AC-10 against the built exe
      - run: pnpm build
      - run: pnpm --filter @aios/desktop package   # unsigned: AIOS_SIGN is set only in release.yml
      - uses: actions/upload-artifact@v4
        with:
          name: aios-windows-unsigned
          path: |
            apps/desktop/release/*.exe
            build/out/backend/
            build/out/llama/manifest-*.json
          retention-days: 14                       # artefact retention (B-02)

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: uv sync --frozen --all-packages --all-extras
      - run: pnpm install --frozen-lockfile
      - name: Python dependency scan (exceptions record applies)
        run: uv run python tools/release/dependency_scan.py
      - name: Node dependency scan (exceptions record applies)
        run: |
          pnpm audit --prod --json > pnpm-audit.json || true
          node tools/release/check-npm-audit.mjs pnpm-audit.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan
          path: |
            build/out/scan/
            pnpm-audit.json
          retention-days: 14
