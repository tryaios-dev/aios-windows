[project]
name = "aios-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["aios-common", "aios-backend", "aios-evidence-writer"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/py/*", "services/*"]

[tool.uv.sources]
aios-common = { workspace = true }
aios-backend = { workspace = true }
aios-evidence-writer = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",        # FastAPI TestClient
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "jsonschema>=4.23",
    "types-psutil>=6.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["node_modules", "apps/desktop", "apps/ui", "packages/ts", "build/out", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20", "FAST"]
ignore = ["S101", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["aios_backend", "aios_common", "aios_evidence_writer", "db"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"tools/**" = ["T201", "S603", "S607"]
"build/**" = ["T201", "S603", "S607", "S310"]
"**/cli.py" = ["T201"]
"**/db/migrations/**" = ["E501"]
"**/tests/**" = ["S105", "S106"]
"tests/engine/**" = ["S310", "S603", "S607"]   # starts llama-server, loopback HTTP

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sqlcipher3", "sqlcipher3.*"]   # ships no type information
ignore_missing_imports = true

# ---------------------------------------------------------------- import boundaries
[tool.importlinter]
root_packages = ["aios_backend", "db", "aios_common", "aios_evidence_writer"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Shared package never imports the backend"
type = "forbidden"
source_modules = ["aios_common"]
forbidden_modules = ["aios_backend", "db"]

[[tool.importlinter.contracts]]
name = "AC-14: the backend never imports the evidence writer (only the writer opens evidence.db)"
type = "forbidden"
source_modules = ["aios_backend", "db"]
forbidden_modules = ["aios_evidence_writer"]

[[tool.importlinter.contracts]]
name = "The evidence writer never imports the backend or chats.db code"
type = "forbidden"
source_modules = ["aios_evidence_writer"]
forbidden_modules = ["aios_backend", "db"]

[[tool.importlinter.contracts]]
name = "Only db.sqlcipher imports sqlcipher3"
type = "forbidden"
source_modules = [
    "aios_backend.main", "aios_backend.cli", "aios_backend.config", "aios_backend.routes",
    "aios_backend.apps", "aios_backend.deps", "aios_backend.errors",
    "db.session", "db.migrate", "db.base", "db.models", "db.registry", "db.outbox", "db.lookups",
]
forbidden_modules = ["sqlcipher3"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only aios_common.keystore imports keyring"
type = "forbidden"
source_modules = ["aios_backend", "db", "aios_common.handshake", "aios_common.asgi_auth", "aios_common.logging", "aios_common.paths", "aios_common.platforms", "aios_common.canonical"]
forbidden_modules = ["keyring"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Backend apps never import each other (same rule as apps/ui/src/features)"
type = "independence"
modules = [
    "aios_backend.apps.chat", "aios_backend.apps.evidence", "aios_backend.apps.models", "aios_backend.apps.projects", "aios_backend.apps.search", "aios_backend.apps.settings", "aios_backend.apps.setup", "aios_backend.apps.spike",
]

[[tool.importlinter.contracts]]
name = "App layers: router -> service -> repository -> models"
type = "layers"
containers = [
    "aios_backend.apps.chat", "aios_backend.apps.evidence", "aios_backend.apps.models", "aios_backend.apps.projects", "aios_backend.apps.search", "aios_backend.apps.settings", "aios_backend.apps.setup", "aios_backend.apps.spike",
]
layers = ["router", "service", "repository", "models"]

[[tool.importlinter.contracts]]
name = "Routes stay thin: no ORM, DB driver, processes or raw network"
type = "forbidden"
source_modules = [
    "aios_backend.routes",
    "aios_backend.apps.chat.router",
    "aios_backend.apps.evidence.router",
    "aios_backend.apps.models.router",
    "aios_backend.apps.projects.router",
    "aios_backend.apps.search.router",
    "aios_backend.apps.settings.router",
    "aios_backend.apps.setup.router",
    "aios_backend.apps.spike.router",
]
forbidden_modules = ["sqlalchemy", "sqlcipher3", "subprocess", "httpx", "socket"]
allow_indirect_imports = true
