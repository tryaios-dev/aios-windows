appId: com.tryaios.aios
productName: AIOS
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: ../ui/dist
    to: ui
  - from: ../../build/out/backend
    to: backend
  # the only program that opens evidence.db (F-01); started by the backend
  - from: ../../build/out/evidence-writer
    to: evidence-writer
  # the independent evidence verifier (F-03/F-04), run with AIOS.exe's own Node.js runtime
  - from: ../verifier-cli/dist
    to: verifier/dist
  - from: ../verifier-cli/package.json
    to: verifier/package.json
  - from: ../../build/installer/aios-verify.cmd
    to: verifier/aios-verify.cmd
  # llama-server CPU + Vulkan, built from the source pinned in build/llama/manifest.json (build/llama/build.py)
  - from: ../../build/out/llama/cpu
    to: llama/cpu
  - from: ../../build/out/llama/vulkan
    to: llama/vulkan
  # licence texts for bundled binaries and models (licenses/README.md)
  - from: ../../licenses
    to: licenses
# Windows only. Another OS adds its own section here (mac:/linux:) and a package:<os> script;
# see docs/platforms.md.
win:
  target: [nsis]
  # AIOS Soft Square app icon (dark A on a white rounded tile), made by build/icons/make_icons.py
  icon: ../../build/icons/icon.ico
  # Every .exe/.dll is signed through build/signing/azure-sign.js (B-04); credentials come
  # from masked CI variables only.
  signtoolOptions:
    sign: ../../build/signing/azure-sign.js
    publisherName: "PLACEHOLDER - legal entity name"
nsis:
  oneClick: false
  perMachine: false          # per-user install, no admin
  allowElevation: false
  deleteAppDataOnUninstall: false
  installerIcon: ../../build/icons/icon.ico
  uninstallerIcon: ../../build/icons/icon.ico
  installerHeaderIcon: ../../build/icons/icon.ico
  include: ../../build/installer/installer.nsh   # "remove my data?" on uninstall, default No (AC-22)
publish:
  provider: generic
  url: https://updates.example.eu/aios   # B-06: real update-feed host from A-05
