[project]
name = "aios-evidence-writer"
version = "0.1.0"
description = "evidence-writer.exe: the only process that opens evidence.db (Evidence Wire Format v1, F-01)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "psutil>=6.1",        # exit when the backend is gone
    "cryptography>=44",   # Ed25519 checkpoint and manifest signatures
    "aios-common",
]

[project.scripts]
aios-evidence-writer = "aios_evidence_writer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aios_evidence_writer"]
