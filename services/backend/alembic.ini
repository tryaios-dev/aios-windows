# Plain Alembic for chats.db, for developers who prefer `alembic ...` over `aios-backend ...`.
#   uv run alembic -c services/backend/alembic.ini upgrade head
# The database comes from $AIOS_ENV (dev by default); the desktop profile is refused.
[alembic]
script_location = %(here)s/src/aios_backend/db/migrations
prepend_sys_path = %(here)s/src
file_template = %%(rev)s_%%(slug)s
