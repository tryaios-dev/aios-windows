[project]
name = "aios-backend"
version = "0.1.0"
description = "backend.exe: local API for the AIOS desktop app (FastAPI, SQLAlchemy + Alembic on SQLCipher)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "httpx>=0.27",        # backend -> engine (and later company provider), MVP 6
    "psutil>=6.1",        # process manager: orphan clean-up, parent-exit watch (IPC-51, IPC-52)
    "cryptography>=44",  # Recovery Package v1: Argon2id, AES-256-GCM, Ed25519
    # SQLCipher build: pinned exactly (B-02). Bumping it is a reviewed change that also updates
    # build/sqlcipher/pin.json. Windows wheel = what ships; the Linux build is for CI tests only.
    "sqlcipher3==0.6.4; sys_platform == 'win32'",
    "sqlcipher3-binary==0.6.0; sys_platform == 'linux'",
    "aios-common",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11"]

[project.scripts]
aios-backend = "aios_backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aios_backend", "db"]
